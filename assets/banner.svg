<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card/Pill Fill Gradient -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes scanLine {
      0% { transform: translateY(-100px); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(400px); opacity: 0.1; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(10px); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .bg-animate { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
    .scan-animate { animation: scanLine 6s linear infinite; }
    .float-1 { animation: floatParticle 5s ease-in-out infinite; }
    .float-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .ring-rotate { animation: rotateRing 25s linear infinite; transform-origin: 1050px 180px; }
    
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #CBD5E1;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #818CF8;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />

  <!-- Grid Background Pattern -->
  <g opacity="0.12">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200 M0 320 H1200" stroke="#94A3B8" stroke-width="1" />
    <path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360 M500 0 V360 M600 0 V360 M700 0 V360 M800 0 V360 M900 0 V360 M1000 0 V360 M1100 0 V360" stroke="#94A3B8" stroke-width="1" />
  </g>

  <!-- Background Dynamic Glowing Blobs -->
  <circle cx="150" cy="80" r="180" fill="url(#primaryGlow)" class="bg-animate" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="200" fill="url(#accentGlow)" class="bg-animate" opacity="0.2" filter="url(#glow)" />

  <!-- Animated Rotating Tech Accent in Background (Far Right) -->
  <g class="ring-rotate" opacity="0.3">
    <circle cx="1050" cy="180" r="110" stroke="#818CF8" stroke-width="2" stroke-dasharray="8 12" fill="none" />
    <circle cx="1050" cy="180" r="130" stroke="#34D399" stroke-width="1.5" stroke-dasharray="15 20" fill="none" />
  </g>

  <!-- Floating Decorative Nodes (Kept safely in lower/side background) -->
  <g class="float-1" opacity="0.5">
    <circle cx="950" cy="100" r="6" fill="#818CF8" />
    <circle cx="1100" cy="120" r="4" fill="#34D399" />
    <line x1="950" y1="100" x2="1100" y2="120" stroke="#818CF8" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <g class="float-2" opacity="0.5">
    <circle cx="980" cy="260" r="5" fill="#F472B6" />
    <circle cx="1120" cy="230" r="7" fill="#60A5FA" />
    <line x1="980" y1="260" x2="1120" y2="230" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Top Category Tag Pill -->
  <g transform="translate(60, 50)">
    <rect width="320" height="32" rx="16" fill="url(#glassGradient)" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1" />
    <text x="16" y="21" class="badge-text">PROFESSIONAL SERVICES AUTOMATION</text>
  </g>

  <!-- FOREGROUND CONTENT LAYER (Guaranteed clear & visible above background animations) -->
  <!-- Main Title -->
  <g transform="translate(60, 140)">
    <!-- Main Header -->
    <text x="0" y="0" class="title-text">Awesome PSA Ecosystem 💼</text>
    <!-- Subtle Gradient Bar under Title -->
    <rect x="0" y="16" width="520" height="4" rx="2" fill="url(#primaryGlow)" />
  </g>

  <!-- Subtitle Description -->
  <g transform="translate(60, 205)">
    <text x="0" y="0" class="subtitle-text">Curated SaaS Platforms &amp; Open-Source Projects for Project Accounting,</text>
    <text x="0" y="28" class="subtitle-text">Resource Planning, Time Tracking &amp; Profitability Management</text>
  </g>

  <!-- Feature Highlights Bar (Bottom Left) -->
  <g transform="translate(60, 285)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" font-family="'Segoe UI', sans-serif" font-size="12" fill="#38BDF8" font-weight="600">📊 SaaS Leaders</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(142, 0)">
      <rect width="165" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" font-family="'Segoe UI', sans-serif" font-size="12" fill="#34D399" font-weight="600">🚀 Open-Source PSA</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(319, 0)">
      <rect width="175" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F472B6" font-weight="600">📈 Market Intelligence</text>
    </g>
  </g>
</svg>
